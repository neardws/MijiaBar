name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Secret scan
        run: scripts/scan-secrets.sh
      - name: Test
        run: scripts/test.sh
      - name: House Metal snapshot smoke
        run: |
          swift build -c release
          .build/release/MijiaBarApp --house-snapshot /tmp/house-ci
          test -f /tmp/house-ci/house-hd2d-night.png
          test -f /tmp/house-ci/house-hd2d-off.png
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || V="0.0.0-dev"
          SIGN_IDENTITY=- VERSION="$V" scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MijiaBar-dmg
          path: dist/*.dmg
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
